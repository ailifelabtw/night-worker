name: IP Test

on:
  workflow_dispatch:

jobs:
  check-ip:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Show IP
        run: |
          echo "UTC time: $(date -u)"
          echo "Hostname: $(hostname)"
          echo "IP (ifconfig.me): $(curl -s --max-time 10 ifconfig.me)"
          echo "IP (ipify): $(curl -s --max-time 10 https://api.ipify.org)"
          echo "IP (icanhazip): $(curl -s --max-time 10 https://icanhazip.com)"
